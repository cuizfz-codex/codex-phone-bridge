<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-i18n="page.title">Codex Mobile Threads</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside id="sidebar" class="sidebar">
        <header class="sidebar-top">
          <div
            id="quota-widget"
            class="quota-widget sidebar-quota-widget"
            title="Codex 限额剩余（来自 account/rateLimits/read）"
            data-i18n-title="tooltip.quotaUsage"
          >
            <div class="quota-ring-strip">
              <div class="quota-ring-item">
                <div id="sidebar-quota-5h-ring" class="sidebar-mini-ring quota">
                  <span class="sidebar-ring-tag">5h</span>
                </div>
                <span class="quota-value-stack">
                  <span id="quota-5h-text" class="quota-value">--%</span>
                  <span id="quota-5h-reset" class="quota-reset-time">--.-- --:--</span>
                </span>
              </div>
              <div class="quota-ring-item">
                <div id="sidebar-quota-7d-ring" class="sidebar-mini-ring quota">
                  <span class="sidebar-ring-tag">7d</span>
                </div>
                <span class="quota-value-stack">
                  <span id="quota-7d-text" class="quota-value">--%</span>
                  <span id="quota-7d-reset" class="quota-reset-time">--.-- --:--</span>
                </span>
              </div>
            </div>
          </div>
          <button id="open-settings" class="btn ghost" type="button" data-i18n="btn.settings">设置</button>
        </header>

        <section class="sidebar-session-info">
          <p id="sidebar-status" class="sub" data-i18n="status.initializing">状态: 初始化中...</p>
        </section>

        <section class="sidebar-controls">
          <div class="sidebar-primary-actions">
            <button id="new-thread-btn" class="btn" type="button" data-i18n="btn.newThread">新建 Thread</button>
            <button id="refresh-threads-btn" class="btn ghost" type="button" data-i18n="btn.refresh">刷新</button>
            <button id="display-mode-btn" class="btn mini ghost display-mode-btn" type="button">
              简洁显示
            </button>
          </div>
        </section>

        <section id="thread-list" class="thread-list"></section>
      </aside>

      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
      <button id="menu-toggle" class="drawer-handle" type="button" aria-label="菜单" aria-expanded="false">❯</button>

      <main class="main">
        <header class="main-top">
          <div class="title-wrap">
            <h2 id="thread-title" data-i18n="thread.selectPrompt">请选择一个 Thread</h2>
            <p id="thread-meta" class="sub"></p>
          </div>
        </header>

        <section id="status-bar" class="status" data-i18n="status.initializing">状态: 初始化中...</section>

        <section id="approval-banner" class="approval-banner hidden">
          <button id="approval-toggle-btn" class="btn ghost mini" type="button">审批请求 (0)</button>
        </section>

        <section id="approval-panel" class="approval-panel hidden">
          <header>
            <h3 data-i18n="approval.title">审批请求</h3>
            <button id="approval-hide-btn" class="btn ghost mini" type="button">隐藏</button>
          </header>
          <div id="approval-list"></div>
        </section>

        <section id="chat" class="chat"></section>

        <form id="composer" class="composer">
          <div class="composer-topline">
            <section id="model-float" class="model-float" aria-label="模型设置">
              <div id="model-float-badge" class="model-float-badge" aria-live="polite">
                <span class="model-float-kicker">MODEL</span>
                <span class="model-float-main">gpt-5.5</span>
                <span id="model-effort-current" class="model-float-effort">中</span>
              </div>
            </section>
            <button id="composer-toggle" class="composer-toggle" type="button" aria-label="展开输入" aria-expanded="false">⌃</button>
            <div
              id="context-widget"
              class="context-widget composer-context-widget"
              title="上下文窗口使用率"
              data-i18n-title="tooltip.contextUsage"
            >
              <div id="context-ring" class="context-ring"></div>
              <div class="context-meta">
                <div class="context-caption" data-i18n="label.context">上下文</div>
                <div id="context-usage-text" class="context-usage-text">-- / --</div>
                <div id="context-pct-text" class="context-pct-text">--%</div>
              </div>
            </div>
          </div>
          <textarea id="message-input" rows="3" placeholder="输入消息，支持文本 + 图片" data-i18n-placeholder="input.message"></textarea>
          <section id="attachments" class="attachments hidden">
            <div id="pending-images" class="pending-images"></div>
          </section>
          <div class="composer-actions">
            <input id="image-picker" type="file" accept="image/*" multiple hidden />
            <button id="pick-image-btn" class="btn ghost" type="button" data-i18n="btn.image">图片</button>
            <button id="send-btn" class="btn primary" type="submit" data-i18n="btn.send">发送</button>
          </div>
        </form>
      </main>
    </div>

    <dialog id="settings-dialog">
      <form id="settings-form" method="dialog" class="settings-form">
        <h3 data-i18n="settings.title">连接设置</h3>
        <label>
          <span data-i18n="settings.server">服务器地址</span>
          <input id="server-base" type="text" placeholder="" data-i18n-placeholder="settings.serverPlaceholder" />
        </label>
        <label>
          <span data-i18n="settings.quickPick">快速选择地址</span>
          <select id="server-base-preset">
            <option value="" data-i18n="settings.quickPickPlaceholder">请选择地址...</option>
          </select>
        </label>
        <section class="settings-section">
          <h4 data-i18n="settings.displayPrefs">界面显示</h4>
          <label>
            <span data-i18n="settings.language">语言</span>
            <select id="language-select">
              <option value="system" data-i18n="settings.languageSystem">跟随系统</option>
              <option value="zh" data-i18n="settings.languageZh">中文</option>
              <option value="en" data-i18n="settings.languageEn">English</option>
            </select>
          </label>
          <label>
            <span data-i18n="settings.theme">亮暗风格</span>
            <select id="theme-select">
              <option value="system" data-i18n="settings.themeSystem">跟随系统</option>
              <option value="light" data-i18n="settings.themeLight">亮色</option>
              <option value="dark" data-i18n="settings.themeDark">暗色</option>
            </select>
          </label>
        </section>
        <input id="auth-token" type="hidden" value="" />
        <p class="setting-note" data-i18n="settings.note">
          无需 token 或配对；若服务器开启密码模式，会自动弹出登录框。
        </p>
        <menu>
          <button id="cancel-settings" type="button" class="btn ghost" data-i18n="btn.cancel">取消</button>
          <button type="submit" class="btn" data-i18n="btn.save">保存</button>
        </menu>
      </form>
    </dialog>

    <dialog id="login-dialog">
      <form id="login-form" method="dialog" class="settings-form login-form">
        <h3 data-i18n="login.title">访问登录</h3>
        <p class="sub" data-i18n="login.hint">
          输入访问密码后继续；若服务器处于开放模式，将自动进入。
        </p>
        <label>
          <span data-i18n="login.password">访问密码</span>
          <input
            id="login-password"
            type="password"
            autocomplete="current-password"
            placeholder="留空表示无密码"
            data-i18n-placeholder="login.passwordPlaceholder"
          />
        </label>
        <p id="login-status" class="sub"></p>
        <menu>
          <button type="submit" class="btn" data-i18n="btn.login">登录</button>
        </menu>
      </form>
    </dialog>

    <script src="/vendor/jsQR.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
