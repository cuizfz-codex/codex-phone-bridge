name: build-macos

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop Dependencies
        run: |
          npm ci
          cd desktop
          npm ci

      - name: Build phone-codex (macOS)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cd desktop
          npm run dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phone-codex-macos
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
